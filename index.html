<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="tiktok-developers-site-verification" content="I9BYueDa26Qb1OSa20WDtnwSZVppkKR1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拒绝加班！昭和职场大逃杀</title>
    <style>
        :root {
            --bg-color: #2d3436;
            --showa-red: #d63031;
            --showa-gold: #fdcb6e;
            --panel-bg: #f5e6ca;
            --btn-blue: #0984e3;
            --btn-green: #2ecc71;
            --tiktok-color: #25F4EE;
            --tiktok-secondary: #FE2C55;
        }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden; touch-action: none;
        }
        .game-container {
            position: relative; width: 100%; max-width: 450px; height: 95vh;
            background: #000; border: 6px solid #4a3020; border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; background: var(--panel-bg); }
        
        /* 页面基础样式 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; padding: 20px; text-align: center;
        }

        /* 首页状态 */
        #homeScreen { background: var(--panel-bg); }
        
        /* 结算页状态 */
        #gameOverScreen { display: none; background: rgba(0,0,0,0.9); color: white; }

        .title-card {
            background: var(--showa-red); color: white; padding: 15px 20px;
            border: 5px solid white; transform: rotate(-2deg);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.3); margin-bottom: 20px;
            width: 100%;
        }
        
        /* 用户信息区 */
        .user-info {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 101; background: rgba(255,255,255,0.9);
            padding: 8px 15px; border-radius: 30px; border: 2px solid #4a3020;
            font-weight: bold;
        }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #ddd;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { flex: 1; margin-left: 10px; color: #333; }
        .logout-btn { 
            background: var(--tiktok-secondary); color: white; 
            border: none; padding: 5px 12px; border-radius: 20px;
            font-size: 0.9rem; cursor: pointer;
        }
        
        /* 按钮组 */
        .btn-group { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .btn {
            width: 80%; background: var(--showa-gold); color: #2d3436; border: none;
            padding: 15px; font-size: 1.5rem; font-weight: 900;
            border-radius: 50px; cursor: pointer; border-bottom: 5px solid #d4a017;
            transition: 0.1s; margin: 8px 0;
        }
        .btn:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 1px; }
        .btn:disabled { background: #95a5a6; border-bottom-color: #7f8c8d; color: #bdc3c7; cursor: not-allowed; }
        
        .btn-ad { background: var(--btn-blue); border-bottom-color: #06528e; color: white; }
        .btn-tiktok { 
            background: linear-gradient(135deg, var(--tiktok-color), var(--tiktok-secondary)); 
            border-bottom-color: #161616; color: white; 
        }

        /* 分数显示 */
        .score-ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; z-index: 50; display: none;
        }
        .score-box {
            display: inline-block; background: rgba(45, 52, 54, 0.9); 
            color: var(--showa-gold); padding: 5px 20px; border-radius: 20px;
            font-size: 1.5rem; font-weight: bold; border: 2px solid var(--showa-gold);
        }

        /* 模拟广告层 - 改为UI模拟，不用alert */
        #adLayer {
            display: none; position: absolute; z-index: 200; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            color: #fff;
            justify-content: center; align-items: center; 
            font-size: 2rem;
            flex-direction: column;
        }
        
        #adLayer .ad-timer {
            font-size: 4rem;
            color: var(--tiktok-color);
            margin: 20px;
        }

        #adLayer .ad-text {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        #adLayer .ad-skip {
            font-size: 1rem;
            color: #999;
            position: absolute;
            bottom: 30px;
        }
        
        /* 清屏爆炸特效 */
        .clear-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 300; pointer-events: none;
            animation: flash 0.3s ease-out;
        }
        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.9; }
            100% { opacity: 0; }
        }
        
        /* 登录成功提示 */
        .login-toast {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 30px; z-index: 1000; animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 20px; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 20px; }
        }

        /* 隐私政策链接 - 审核必须 */
        .legal-links {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            color: #999;
            z-index: 102;
            padding: 5px;
        }
        .legal-links a {
            color: var(--tiktok-color);
            text-decoration: none;
            margin: 0 8px;
        }
        .legal-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 用户信息栏 -->
    <div id="userInfoBar" class="user-info" style="display: none;">
        <div class="user-avatar" id="userAvatar">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23cccccc'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%23666'%3E👤%3C/text%3E%3C/svg%3E" alt="avatar">
        </div>
        <div class="user-name" id="userName">未登录</div>
        <button class="logout-btn" id="logoutBtn" onclick="game.logout()">退出</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div class="score-ui" id="inGameUI">
        <div class="score-box">工资: <span id="scoreVal">0</span></div>
    </div>

    <div id="homeScreen" class="overlay">
        <div class="title-card">
            <h1 style="margin:0; font-size: 2.2rem;">拒绝加班！昭和职场大逃杀</h1>
        </div>
        
        <!-- TikTok登录按钮 - 使用真实Client Key -->
        <div class="btn-group" style="margin-bottom: 20px;">
            <button class="btn btn-tiktok" id="tiktokLoginBtn">🎵 Login with TikTok</button>
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="game.start()" id="startGameBtn" disabled>正式入职 (需登录)</button>
            <button class="btn btn-ad" onclick="game.watchAd()" id="watchAdBtn" disabled>📺 看视频得奖励</button>
        </div>
        
        <div style="margin-top: 10px; color: #666; font-size: 0.9rem;" id="loginStatus">请先登录TikTok</div>
        
        <!-- 隐私政策和服务条款链接（审核必须） -->
        <div class="legal-links">
            <a href="#" onclick="game.showTerms()">Terms of Service</a> |
            <a href="#" onclick="game.showPrivacy()">Privacy Policy</a>
        </div>
    </div>

    <div id="gameOverScreen" class="overlay">
        <h2 style="color: var(--showa-red); font-size: 2.5rem; margin: 0;">被迫加班...</h2>
        <div style="font-size: 3rem; color: var(--showa-gold); margin: 20px 0;">💰<span id="finalScore">0</span></div>
        
        <div class="btn-group">
            <button id="restartBtn" class="btn" onclick="game.start()">再次挑战 (5s)</button>
            <button class="btn btn-ad" onclick="game.watchAd()">📺 观看广告复活</button>
        </div>
    </div>

    <!-- 广告模拟层 - 使用UI模拟，不用alert -->
    <div id="adLayer">
        <div class="ad-text">📺 广告播放中</div>
        <div class="ad-timer" id="adTimer">3</div>
        <div class="ad-skip">广告后获得奖励</div>
    </div>
</div>

<script>
// ========== 初始化Canvas上下文 ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 添加canvas圆角矩形方法
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
    return this;
};

const config = {
    itemW: 45, itemH: 90,
    items: [
        { text: "加班", color: "#d63031", isKiller: true, weight: 0.45 },
        { text: "工资", color: "#2ecc71", isKiller: false, score: 100, weight: 0.3 },
        { text: "奖金", color: "#f1c40f", isKiller: false, score: 500, weight: 0.15 },
        { text: "休假", color: "#9b59b6", isKiller: false, isClear: true, score: 200, weight: 0.1 }
    ]
};

// ========== 游戏主对象 ==========
const game = {
    active: false,
    score: 0,
    items: [],
    playerX: 0,
    targetX: 0,
    isLoggedIn: false,
    accessToken: null,
    openId: null,

    init() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        this.playerX = canvas.width / 2;
        this.targetX = this.playerX;
        
        // 绑定移动
        const move = (e) => {
            if (!this.active) return;
            e.preventDefault();
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            this.targetX = x - rect.left;
        };
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // 绑定TikTok登录按钮
        document.getElementById('tiktokLoginBtn').addEventListener('click', loginWithTikTok);
        
        // 检查本地存储的登录状态
        this.checkStoredLogin();
        
        // 处理TikTok回调（真实code返回）
        this.handleTikTokCallback();
        
        this.render();
    },
    
    // 检查本地存储
    checkStoredLogin() {
        const token = localStorage.getItem('tiktok_access_token');
        const userInfo = localStorage.getItem('tiktok_user');
        
        if (token && userInfo) {
            this.accessToken = token;
            try {
                const user = JSON.parse(userInfo);
                this.showLoginSuccess(user);
            } catch (e) {}
        }
    },
    
    // TikTok回调处理 - 调用真实后端
    handleTikTokCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");

        console.log("回调参数:", {code, state});

        if (!code || state !== "game_login") return;

        this.showToast("🔄 正在登录...");
        this.exchangeTokenWithBackend(code);

        window.history.replaceState({}, document.title, window.location.pathname);
    },

    // 调用 Render 后端 - 修复版
    async exchangeTokenWithBackend(code) {
        try {
            const response = await fetch(
                "https://tiktok-backend-62sk.onrender.com/api/auth/token",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ code })
                }
            );

            const data = await response.json();
            console.log("后端返回数据:", data);

            // 处理不同格式的后端返回数据
            if (data) {
                // 尝试多种可能的返回格式
                let accessToken = data.access_token || data.accessToken || data.token || data.accessToken;
                let userInfo = data.user || data.userInfo || data.profile || {};
                let refreshToken = data.refresh_token || data.refreshToken;
                
                // 如果直接返回了用户信息（没有嵌套）
                if (data.name && data.avatar) {
                    userInfo = {
                        name: data.name,
                        avatar: data.avatar
                    };
                    accessToken = accessToken || data.access_token || "temp_token";
                }
                
                // 如果有token，就算成功
                if (accessToken) {
                    // 确保用户信息有默认值
                    const finalUserInfo = {
                        name: userInfo.name || userInfo.username || data.username || "TikTok用户",
                        avatar: userInfo.avatar || userInfo.avatar_url || data.avatar || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23cccccc'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%23666'%3E👤%3C/text%3E%3C/svg%3E"
                    };
                    
                    localStorage.setItem("tiktok_access_token", accessToken);
                    localStorage.setItem("tiktok_user", JSON.stringify(finalUserInfo));
                    
                    if (refreshToken) {
                        localStorage.setItem("tiktok_refresh_token", refreshToken);
                    }

                    this.showLoginSuccess(finalUserInfo);
                    this.showToast("✅ TikTok登录成功");
                } else {
                    console.error("登录失败: 没有获取到access_token", data);
                    this.showToast("❌ 登录失败: " + (data.error || data.message || "无法获取token"));
                }
            } else {
                this.showToast("❌ 服务器返回数据为空");
            }

        } catch (err) {
            console.error("网络错误:", err);
            this.showToast("❌ 网络错误，请检查连接");
        }
    },
    
    // 显示登录成功
    showLoginSuccess(userInfo) {
        this.isLoggedIn = true;
        
        // 更新用户信息栏
        document.getElementById('userName').innerText = userInfo.name || "TikTok用户";
        const avatarImg = document.querySelector('#userAvatar img');
        avatarImg.src = userInfo.avatar || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23cccccc'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%23666'%3E👤%3C/text%3E%3C/svg%3E";
        document.getElementById('userInfoBar').style.display = 'flex';
        
        // 启用所有按钮
        document.getElementById('startGameBtn').disabled = false;
        document.getElementById('watchAdBtn').disabled = false;
        
        // 更新状态文字
        document.getElementById('loginStatus').innerHTML = '✅ 已登录：' + (userInfo.name || "TikTok用户");
    },
    
    // 退出登录
    logout() {
        this.isLoggedIn = false;
        this.accessToken = null;
        localStorage.removeItem('tiktok_access_token');
        localStorage.removeItem('tiktok_user');
        localStorage.removeItem('tiktok_refresh_token');
        
        document.getElementById('userInfoBar').style.display = 'none';
        document.getElementById('startGameBtn').disabled = true;
        document.getElementById('watchAdBtn').disabled = true;
        document.getElementById('loginStatus').innerHTML = '请先登录TikTok';
        
        this.showToast('👋 已退出登录');
    },
    
    // 显示提示
    showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'login-toast';
        toast.innerText = message;
        document.querySelector('.game-container').appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    },

    // 显示服务条款（审核必须）
    showTerms() {
        const terms = "TERMS OF SERVICE\n\nThis game uses TikTok Login for authentication. " +
                     "No personal data is stored on our servers. All data is handled according to " +
                     "TikTok's API policies. By using this game, you agree to these terms.";
        alert(terms);
    },
    
    // 显示隐私政策（审核必须）
    showPrivacy() {
        const privacy = "PRIVACY POLICY\n\nWe only access your TikTok profile information (name, avatar) " +
                       "through TikTok's official API. This information is stored locally on your device " +
                       "and is not shared with any third parties. We do not collect any other personal data.";
        alert(privacy);
    },

    // 开始游戏
    start() {
        if (!this.isLoggedIn) {
            this.showToast('请先登录TikTok');
            return;
        }
        
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('inGameUI').style.display = 'block';
        
        this.score = 0;
        this.items = [];
        this.active = true;
        document.getElementById('scoreVal').innerText = '0';
    },

    // 游戏结束
    die() {
        this.active = false;
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('finalScore').innerText = this.score;
        
        const btn = document.getElementById('restartBtn');
        let timeLeft = 5;
        btn.disabled = true;
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.innerText = "再次挑战";
            } else {
                btn.innerText = `再次挑战 (${timeLeft}s)`;
            }
        }, 1000);
    },

    // 看广告逻辑 - 使用UI模拟，不用alert
    watchAd() {
        if (!this.isLoggedIn) {
            this.showToast('请先登录TikTok');
            return;
        }
        
        const adLayer = document.getElementById('adLayer');
        const adTimer = document.getElementById('adTimer');
        adLayer.style.display = 'flex';
        
        let count = 3;
        adTimer.innerText = count;
        
        const itv = setInterval(() => {
            count--;
            adTimer.innerText = count;
            if(count <= 0) {
                clearInterval(itv);
                adLayer.style.display = 'none';
                
                // 广告观看完毕，发放奖励
                this.showToast("🎁 获得奖励");
                
                if (!this.active) {
                    this.start();  // 复活
                } else {
                    this.score += 500;
                    document.getElementById('scoreVal').innerText = this.score;
                }
            }
        }, 1000);
    },
    
    // 清屏特效
    clearScreen() {
        const flash = document.createElement('div');
        flash.className = 'clear-flash';
        document.querySelector('.game-container').appendChild(flash);
        setTimeout(() => flash.remove(), 300);
        
        this.items = [];
        this.score += 200;
        document.getElementById('scoreVal').innerText = this.score;
    },

    update() {
        if (!this.active) return;

        this.playerX += (this.targetX - this.playerX) * 0.2;
        
        // 边界限制
        if (this.playerX < 30) this.playerX = 30;
        if (this.playerX > canvas.width - 30) this.playerX = canvas.width - 30;
        
        // 生成物品
        if (Math.random() < 0.04) {
            let r = Math.random();
            let cumWeight = 0;
            let selectedType = config.items[0];
            
            for (let type of config.items) {
                cumWeight += type.weight;
                if (r < cumWeight) {
                    selectedType = type;
                    break;
                }
            }
            
            this.items.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -100,
                type: selectedType,
                speed: 4 + (this.score / 2000)
            });
        }

        for (let i = this.items.length - 1; i >= 0; i--) {
            const it = this.items[i];
            it.y += it.speed;

            const playerRect = {
                x: this.playerX - 25,
                y: canvas.height - 95,
                w: 50,
                h: 70
            };
            
            const itemRect = {
                x: it.x - config.itemW/2,
                y: it.y - config.itemH/2,
                w: config.itemW,
                h: config.itemH
            };

            if (this.rectCollide(playerRect, itemRect)) {
                if (it.type.isKiller) {
                    this.die();
                    return;
                } else {
                    if (it.type.isClear) {
                        this.clearScreen();
                        this.items.splice(i, 1);
                        break;
                    } else {
                        this.score += it.type.score;
                        document.getElementById('scoreVal').innerText = this.score;
                        this.items.splice(i, 1);
                    }
                }
            } else if (it.y > canvas.height + 100) {
                this.items.splice(i, 1);
            }
        }
    },
    
    rectCollide(r1, r2) {
        return !(r2.x > r1.x + r1.w ||
                 r2.x + r2.w < r1.x ||
                 r2.y > r1.y + r1.h ||
                 r2.y + r2.h < r1.y);
    },

    draw() {
        ctx.fillStyle = '#f5e6ca';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#c0a070';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < canvas.width; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
        }
        
        ctx.fillStyle = '#2d3436';
        ctx.fillRect(this.playerX - 25, canvas.height - 95, 50, 50);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath(); 
        ctx.arc(this.playerX, canvas.height - 110, 20, 0, Math.PI*2); 
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.playerX - 8, canvas.height - 117, 3, 0, Math.PI*2);
        ctx.arc(this.playerX + 8, canvas.height - 117, 3, 0, Math.PI*2);
        ctx.fill();

        this.items.forEach(it => {
            ctx.fillStyle = it.type.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(it.x - config.itemW/2, it.y - config.itemH/2, config.itemW, config.itemH, 8);
            ctx.fill(); 
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            const chars = it.type.text.split('');
            chars.forEach((c, idx) => ctx.fillText(c, it.x, it.y - 15 + idx * 30));
        });
    },

    render() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.render());
    }
};

window.onload = () => game.init();
</script>
